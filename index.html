<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="theme-color" content="#6b4f36" />
  <title>BREWS.CO</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script src="js/appstyle.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/header.js"></script>
  <style>
    body { padding: 0; }
    .home { max-width: 440px; margin: 0 auto; padding: 36px 18px 24px; display: flex; flex-direction: column; gap: 14px; }
    .home-logo { text-align: center; text-decoration: none; display: block; margin-bottom: 6px; }
    .home-logo .brand { font-size: 2rem; color: var(--espresso); letter-spacing: 0.20em; }
    .home-logo .brand-sub { font-size: 0.64rem; color: var(--dust); margin: 4px 0 0; letter-spacing: 0.14em; text-transform: uppercase; }
    .home-greet { text-align: center; font-family: "Cormorant Garamond", serif; font-size: 1.4rem; font-weight: 700; color: var(--espresso); }

    .shift-card { background: var(--grad-card); border: 1.5px solid var(--latte); border-radius: 22px; padding: 22px 20px; box-shadow: var(--shadow-card); position: relative; overflow: hidden; }
    .shift-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--grad-cta); }
    .shift-state { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bark); display: flex; align-items: center; gap: 7px; }
    .shift-state i { width: 8px; height: 8px; border-radius: 50%; background: var(--mochaccino); display: inline-block; }
    .shift-state i.live { background: #6ab86a; animation: pulse .9s infinite; }
    .shift-title { font-size: 1.15rem; font-weight: 800; color: var(--roast); margin: 8px 0 4px; }
    .shift-sub { font-size: 0.8rem; color: var(--bark); margin-bottom: 14px; }
    .shift-btn { display: block; text-align: center; text-decoration: none; background: var(--grad-cta); color: #fff; border-radius: var(--radius-lg); padding: 14px; font-size: 0.92rem; font-weight: 700; box-shadow: var(--shadow-btn); }
    .shift-btn:active { transform: scale(0.98); }

    .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { background: var(--pearl); border: 1.5px solid var(--latte); border-radius: var(--radius-lg); padding: 12px 14px; }
    .stat span { display: block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dust); }
    .stat b { display: block; font-size: 1.05rem; color: var(--roast); margin-top: 3px; font-variant-numeric: tabular-nums; }

    /* ── Sync card ── */
    .sync-card {
      width:100%; max-width:400px; margin-top:14px;
      background:var(--pearl); border:1.5px solid var(--latte);
      border-radius:var(--radius-lg); padding:14px 16px;
      box-shadow:0 1px 6px rgba(60,20,0,0.06);
    }
    .sync-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .sync-status { display:flex; align-items:center; gap:7px; font-size:0.72rem; color:var(--bark); font-weight:600; }
    .sync-dot { width:8px; height:8px; border-radius:50%; background:var(--mochaccino); flex-shrink:0; transition:background .3s; }
    .sync-dot.ok    { background:#6ab86a; }
    .sync-dot.busy  { background:var(--honey); animation:pulse .8s infinite; }
    .sync-dot.error { background:var(--danger); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .sync-btns { display:flex; gap:8px; }
    .home-offline-pill {
      width:100%; max-width:400px; margin-top:8px;
      background: linear-gradient(135deg,var(--danger-darkest),var(--danger-deep));
      color:var(--white); text-align:center; padding:8px 14px;
      border-radius:var(--radius-md); font-size:0.78rem; font-weight:700;
      display:none; box-shadow:0 2px 8px rgba(180,60,0,0.30);
    }
    .home-offline-pill.visible { display:block; }
    .sync-btn { flex:1; padding:9px 10px; border-radius:var(--radius-md); font-size:0.82rem; font-weight:700; font-family:"Plus Jakarta Sans",sans-serif; cursor:pointer; border:none; transition:all .18s; text-align:center; }
    .sync-btn-push { background:var(--grad-cta); color:var(--white); box-shadow:var(--shadow-btn); }
    .sync-btn-push:hover { filter:brightness(1.08); transform:translateY(-1px); }
    .sync-btn-pull { background:var(--parchment); color:var(--mahogany); border:1.5px solid var(--latte); }
    .sync-btn-pull:hover { background:var(--latte); transform:translateY(-1px); }
    .sync-btn:disabled { opacity:0.5; cursor:default; transform:none; }

  </style>
</head>
<body class="has-bottom-nav">
  <div class="home">
    <a href="index.html" class="home-logo">
      <div class="brand">BREWS.CO</div>
      <div class="brand-sub" id="homeDate"></div>
    </a>
    <div class="home-greet" id="homeGreet"></div>

    <div class="shift-card" id="shiftCard"></div>

    <div class="stat-row">
      <div class="stat"><span>Today's Total</span><b id="todayTotal">—</b></div>
      <div class="stat"><span>Orders Today</span><b id="todayOrders">—</b></div>
    </div>

    <div class="sync-card" style="max-width:none;margin-top:0;">
      <div class="sync-row" style="margin-bottom:10px;">
        <div class="sync-status">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncStatusText">Not synced yet</span>
        </div>
      </div>
      <div class="sync-btns">
        <button class="sync-btn sync-btn-push" id="syncPushBtn" onclick="doSync('push')">☁️ Push</button>
        <button class="sync-btn sync-btn-pull" id="syncPullBtn" onclick="doSync('pull')">⬇️ Pull</button>
      </div>
    </div>
    <div class="home-offline-pill" id="homeOfflinePill" style="max-width:none;">📡 No connection. Sync when back online</div>
  </div>

  <script>document.write(renderBottomNav("home", { navId: "bottomNav" }));</script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" onerror="console.warn('Firebase CDN unavailable')"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" onerror="console.warn('Firebase CDN unavailable')"></script>
  <script>
    window.syncPush           = async function() { throw new Error("Sync not available."); };
    window.syncPull           = async function() { throw new Error("Sync not available."); };
    window.getLastSyncDisplay = () => null;
  </script>
  <script src="js/sync.js" onerror="console.warn('sync.js not found')"></script>

  <script>
    applyBottomNavRole();

    // ── Header ─────────────────────────────────────────────────────────────────
    const now = new Date();
    const hr = now.getHours();
    document.getElementById("homeGreet").textContent = hr < 12 ? "Good morning ☕" : hr < 18 ? "Good afternoon 🧋" : "Good evening 🌙";
    document.getElementById("homeDate").textContent = now.toLocaleDateString("en-PH", { weekday: "long", month: "long", day: "numeric" });

    // ── Shift card ─────────────────────────────────────────────────────────────
    function renderShiftCard() {
      const card = document.getElementById("shiftCard");
      const active = !!localStorage.getItem("brewsShiftActive");
      const saved  = !!localStorage.getItem("brewsResumeShift");
      if (active) {
        let start = 0;
        try { start = JSON.parse(localStorage.getItem("brewsPOSState") || "{}").shiftStartTime || 0; } catch {}
        const ms = start ? Date.now() - start : 0;
        const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
        card.innerHTML = `
          <div class="shift-state"><i class="live"></i>Shift in progress</div>
          <div class="shift-title">${start ? (h > 0 ? h + "h " : "") + m + "m running" : "Shift is running"}</div>
          <div class="shift-sub">Your orders are saved on this device.</div>
          <a href="pos.html" class="shift-btn">Return to Shift →</a>`;
      } else if (saved) {
        card.innerHTML = `
          <div class="shift-state"><i></i>Unfinished shift</div>
          <div class="shift-title">Pick up where you left off</div>
          <div class="shift-sub">Your orders are safe.</div>
          <a href="pos.html" class="shift-btn">Resume Shift →</a>`;
      } else {
        card.innerHTML = `
          <div class="shift-state"><i></i>No active shift</div>
          <div class="shift-title">Ready when you are</div>
          <div class="shift-sub">Enter your beginning cups to start.</div>
          <a href="pos.html" class="shift-btn">Start Shift →</a>`;
      }
    }
    renderShiftCard();
    setInterval(renderShiftCard, 30000);

    // ── Today ──────────────────────────────────────────────────────────────────
    (function renderToday() {
      const today = now.toISOString().split("T")[0];
      try {
        const hist = JSON.parse(localStorage.getItem("inventoryHistory") || "[]");
        const e = hist.find(h => h.date === today);
        if (e) {
          const div = document.createElement("div");
          div.innerHTML = e.results;
          for (const row of div.querySelectorAll("tr")) {
            const c = row.querySelectorAll("td");
            if (c.length >= 2 && c[0].textContent.includes("Final Total")) { document.getElementById("todayTotal").textContent = c[1].textContent.trim(); break; }
          }
        }
        const logs = JSON.parse(localStorage.getItem("brewsOrderLog") || "[]");
        const l = logs.find(x => x.date === today);
        if (l) document.getElementById("todayOrders").textContent = (l.orders || []).length;
        else {
          const st = JSON.parse(localStorage.getItem("brewsPOSState") || "{}");
          if (st.orders) document.getElementById("todayOrders").textContent = st.orders.length;
        }
      } catch {}
    })();

    // ── Sync ───────────────────────────────────────────────────────────────────
    function setSyncUI(state, msg) {
      document.getElementById("syncDot").className = "sync-dot " + (state || "");
      document.getElementById("syncStatusText").textContent = msg;
      const busy = state === "busy";
      document.getElementById("syncPushBtn").disabled = busy;
      document.getElementById("syncPullBtn").disabled = busy;
    }
    function initSyncDisplay() {
      const last = getLastSyncDisplay();
      setSyncUI(last ? "ok" : "", last ? "Last synced " + last : "Not synced yet");
    }
    async function doSync(direction) {
      if (direction === "push" && !confirm("Push to cloud?\n\nThis sends this device's history, orders, settings and menu.")) return;
      setSyncUI("busy", direction === "push" ? "Pushing…" : "Pulling…");
      try {
        if (direction === "push") { await syncPush(); setSyncUI("ok", "Pushed " + getLastSyncDisplay()); }
        else                      { await syncPull(); setSyncUI("ok", "Pulled " + getLastSyncDisplay()); }
      } catch (e) {
        setSyncUI("error", "⚠ " + (e.message || "Sync failed"));
        setTimeout(initSyncDisplay, 4000);
      }
    }
    async function autoPull() {
      if (localStorage.getItem("brewsShiftActive")) return;
      setSyncUI("busy", "Auto-syncing…");
      try { await syncPull(); setSyncUI("ok", "Auto-synced " + getLastSyncDisplay()); }
      catch (e) { setSyncUI("error", "⚠ Auto-sync failed"); setTimeout(initSyncDisplay, 3000); }
    }
    initSyncDisplay();
    setTimeout(autoPull, 1500);
    setInterval(autoPull, 3 * 60 * 1000);

    const _pill = document.getElementById("homeOfflinePill");
    const _setOffline = v => _pill.classList.toggle("visible", v);
    window.addEventListener("online",  () => _setOffline(false));
    window.addEventListener("offline", () => _setOffline(true));
    if (!navigator.onLine) _setOffline(true);

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");
  </script>
</body>
</html>
